name: Android CI

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "core/**"
      - "rust-toolchain.toml"
      - "localization/**"
      - ".gitmodules"
      - ".github/actions/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "android/**"
      - "core/**"
      - "rust-toolchain.toml"
      - "localization/**"
      - ".gitmodules"
      - ".github/actions/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  unit_test:
    runs-on: ubuntu-latest
    env:
      UNIT_TESTS: "true"
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup Android CI
        uses: ./.github/actions/setup-android-ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android toolchains
        run: |
          just install-toolchains
          just install-ndk

      - name: Build app
        run: just build

      - name: Run unit tests
        run: just test

  store_contract_tests:
    runs-on: ubuntu-latest
    env:
      UNIT_TESTS: "true"
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Setup Android CI
        uses: ./.github/actions/setup-android-ci

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android toolchains
        run: |
          just install-toolchains
          just install-ndk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run store contract tests on an emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :data:services:store:connectedDebugAndroidTest

      - name: Upload store contract test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-contract-test-report
          path: |
            android/data/services/store/build/reports/androidTests/connected
            android/data/services/store/build/outputs/androidTest-results/connected
